<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가챠트립 - 02_온보딩_1</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #EEF2F9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* 📱 모바일 퍼스트 반응형 컨테이너 */
    .app-viewport {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #FAFBFF;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .app-viewport {
        width: 393px;
        height: 844px;
        border-radius: 44px;
        box-shadow: 0 25px 65px -12px rgba(18, 31, 66, 0.22), 0 0 0 10px #1E293B;
      }
    }

    /* 중앙 배경 소프트 글로우 */
    .center-glow {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108, 98, 255, 0.18) 0%, rgba(140, 175, 255, 0.08) 50%, rgba(250, 251, 255, 0) 70%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
    }

    /* 피그마 1:1 오토레이아웃 버튼 스타일 */
    .btn-gradient-cta {
      background: linear-gradient(180deg, #5863FF 0%, #7361FF 100%);
      box-shadow: 0 7px 14px rgba(66, 76, 158, 0.24);
      border-radius: 20px;
      height: 58px;
      transition: all 0.2s ease;
    }
    .btn-gradient-cta:active {
      transform: scale(0.98);
      box-shadow: 0 4px 8px rgba(66, 76, 158, 0.2);
    }
  </style>
</head>
<body>

  <!-- 메인 모바일 뷰포트 -->
  <main class="app-viewport px-6 pt-16 pb-8 select-none">
    
    <!-- 배경 소프트 블루/퍼플 글로우 -->
    <div class="center-glow"></div>

    <!-- 1. 상단 타이틀 & 텍스트 영역 (순수 HTML/CSS) -->
    <div class="relative z-10 flex flex-col items-center text-center mt-4">
      
      <!-- 헤드라인 타이틀 (피그마 1:1 폰트/컬러 스펙) -->
      <div class="flex flex-col items-center mb-4">
        <h1 class="text-[22px] font-extrabold text-[#151B3F] tracking-[-0.03em] leading-tight">
          어디로 갈지 고민될 땐,
        </h1>
        <div class="flex items-center justify-center gap-1.5 mt-1">
          <span class="text-[32px] font-black text-[#6C62FF] tracking-[-0.03em] leading-none">
            가챠트립
          </span>
          <img src="./assets/sparkle_star.png" alt="star" class="w-5 h-5 object-contain -mt-3 animate-pulse" />
        </div>
      </div>

      <!-- 본문 서브 설명 텍스트 (순수 텍스트) -->
      <p class="text-[14px] font-medium text-[#454545] leading-[1.6] tracking-[-0.02em]">
        원하는 테마와 취향을 선택하고<br/>
        나만의 특별한 랜덤 여행을 시작해보세요.
      </p>

    </div>

    <!-- 2. 중앙 캐릭터/일러스트 그래픽 영역 -->
    <div class="relative z-10 flex-1 flex flex-col items-center justify-center my-6">
      <div class="w-[180px] h-[180px] rounded-full bg-white/70 backdrop-blur-sm border border-indigo-50 shadow-sm flex items-center justify-center p-6 relative">
        <img src="./assets/character_capsules.png" alt="가챠트립 캐릭터" class="w-full h-auto object-contain drop-shadow-md" />
      </div>
    </div>

    <!-- 3. 하단 CTA 버튼 영역 (피그마 오토레이아웃 버튼 순수 CSS 구현) -->
    <div class="relative z-10 w-full flex flex-col items-center gap-4">
      
      <!-- 메인 CTA 버튼 -->
      <button type="button" class="btn-gradient-cta w-full max-w-[342px] flex items-center justify-center text-white text-[17px] font-bold tracking-[-0.01em]">
        시작하기
      </button>

      <!-- 하단 보조 둘러보기 버튼 -->
      <button type="button" class="text-[13px] font-semibold text-[#687091] tracking-[-0.02em] py-1 px-3 hover:text-[#151B3F] transition-colors">
        둘러보기
      </button>

      <!-- 모바일 홈 인디케이터 바 -->
      <div class="w-32 h-1 bg-[#121F42]/15 rounded-full mt-2"></div>

    </div>

  </main>

</body>
</html>
